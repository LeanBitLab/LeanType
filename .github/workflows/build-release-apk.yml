name: Build Release APKs

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'beta-*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        if: ${{ env.RELEASE_KEYSTORE != '' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > leantype-release.jks
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" > keystore.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=leantype-release.jks" >> keystore.properties
          echo "storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}" >> keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        run: |
          ./gradlew assembleStandardRelease assembleOfflineRelease
          mkdir dist
          mv app/build/outputs/apk/*/release/*.apk dist/

      # English-only APKs for Android 11+: the UI translations come as language packs
      # (LeanType-Language-Packs builds them from these APKs). The all-languages APKs above
      # stay the main download, and the standard one is what F-Droid compares its build with.
      - name: Build English-only APKs
        run: |
          ./gradlew assembleStandardRelease assembleOfflineRelease -PenglishOnly
          for apk in app/build/outputs/apk/*/release/*.apk; do
            name=$(basename "$apk")
            mv "$apk" "dist/${name%-release.apk}-lite-release.apk"
          done
          ls -l dist

      - name: Generate Release Notes
        # ponytail: generate release notes from changelog during build
        run: python3 docs/scripts/generate_release_notes.py

      - name: Upload APKs and Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: LeanType-Release-APKs
          path: |
            dist/*.apk
            docs/releasenote/release_notes_v*.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/beta-')
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          body_path: docs/releasenote/release_notes_temp.md
          files: |
            dist/*.apk

      # Start the language pack build for this release (packs must be cut from these exact
      # lite APKs). Needs PACKS_DISPATCH_TOKEN: a fine-grained token for
      # LeanBitLab/LeanType-Language-Packs with Actions read/write. The pack repo also checks
      # for new releases every 6 hours, so a missing token only delays the packs.
      - name: Start language pack build
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/beta-')
        env:
          GH_TOKEN: ${{ secrets.PACKS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PACKS_DISPATCH_TOKEN not set, the pack repo picks this release up on its next scheduled run"
            exit 0
          fi
          gh workflow run build-packs.yml -R LeanBitLab/LeanType-Language-Packs -f app_tag="${{ github.ref_name }}"
